<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DCS ILARTS</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* The desktop application (ILARTS.exe) shows this page in a WebView2 over its Direct3D pictures: the page is
   transparent where the monitor screens are, so nothing here may paint a background. */
html, body { margin: 0; height: 100%; background: transparent; }
html { color-scheme: dark; scrollbar-width: thin; scrollbar-color: #4A525A #15181B; }
body { overflow: auto; }  /* `fit` makes the console exactly as tall as the window; a window too small for that scrolls */
ilarts-console { display: block; }
</style>
</head>
<body>
<ilarts-console native-video fit></ilarts-console>
<script src="ilarts-console.js"></script>
<script>
// Bridge between the element and ILARTS.exe (viewer/console.inc):
//   ILARTS.exe -> page: the application's state (an object for el.state), { ask: 'rename', index, name } or
//                       { field: { key, value } } (a settings field the application filled in, e.g. a folder)
//   page -> ILARTS.exe: the element's commands as they are, plus { cmd: 'ready' } and { cmd: 'key', vk }
(function () {
  const el = document.querySelector('ilarts-console');
  const wv = window.chrome && window.chrome.webview;
  if (!wv) return;  // opened in a browser: nothing to talk to (ui/demo.html is the browser demo)
  const send = m => wv.postMessage(m);
  el.addEventListener('command', e => send(e.detail));
  wv.addEventListener('message', e => {
    const d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.field) { el.setSettingsField(d.field.key, d.field.value); return; }  // e.g. the folder picked
    if (d.ask === 'rename') {
      const name = window.prompt('Name for preset ' + d.index + ' (empty = "' + d.index + '"):', d.name || '');
      if (name !== null) send({ cmd: 'rename', index: d.index, name: name.slice(0, 10) });
      return;
    }
    el.state = d;
  });
  // Keys: the application's keyboard shortcuts. Keys with Ctrl or Alt, function keys, arrows and Esc reach the
  // application directly (WebView2 accelerator keys); the rest arrive here and are passed on. Nothing in the page
  // takes typed input, so the page itself never acts on a key (no scrolling, no button presses by Space / Enter).
  const typing = e => { const t = e.composedPath()[0]; return !!t && /^(INPUT|SELECT|TEXTAREA|OPTION)$/.test(t.tagName); };
  document.addEventListener('keydown', e => {
    if (el.modalOpen || typing(e)) return;  // the settings dialog: keys are for its fields (Esc closes it)
    e.preventDefault();
    if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
    send({ cmd: 'key', vk: e.keyCode, shift: e.shiftKey, repeat: e.repeat });
  }, true);
  document.addEventListener('keyup', e => { if (!el.modalOpen && !typing(e)) e.preventDefault(); }, true);
  // Buttons never take the keyboard focus (a focused button would react to Space / Enter).
  document.addEventListener('mousedown', e => { if (e.button !== 1 && !typing(e)) e.preventDefault(); }, true);
  send({ cmd: 'ready' });
})();
</script>
</body>
</html>
